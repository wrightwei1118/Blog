mainSections   = ["post"]
rssFullContent = true
favicon        = "img/avatar.png"

[footer]
    since = 2025

[sidebar]
    emoji    = "🐱"
    subtitle = "记录技术与生活的点滴"
    avatar   = "img/avatar.png"

[article]
    headingAnchor = true
    math          = false
    toc           = true
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[colorScheme]
    toggle  = true
    default = "dark"

[imageProcessing.cover]
    enabled = true

[imageProcessing.content]
    enabled = true

[comments]
    enabled  = true
    provider = "giscus"

    [comments.giscus]
        repo             = "wrightwei1118/Blog"
        repoID           = ""
        category         = "Announcements"
        categoryID       = ""
        mapping          = "title"
        lightTheme       = "light"
        darkTheme        = "dark_dimmed"
        reactionsEnabled = 1
        emitMetadata     = 0
        inputPosition    = "top"
        lang             = "zh-CN"
        strict           = 0
        loading          = "lazy"
